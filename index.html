<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Georgeanton Flicks — curated full movies</title>
<link rel="icon" href="/ant.svg">
<style>
  :root{--bg:#0a0a0b;--panel:#141416;--line:#232326;--text:#f4f4f5;--dim:#8b8b93;
        --red:#e50914;--green:#39d353}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scrollbar-color:#333 transparent}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased}
  a{color:inherit}

  header{position:fixed;inset:0 0 auto;z-index:60;display:flex;align-items:center;gap:20px;
    padding:14px 40px;background:linear-gradient(180deg,rgba(10,10,11,.98),rgba(10,10,11,.7));
    backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
  header.solid{border-bottom-color:var(--line)}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.6px;color:var(--red);white-space:nowrap}
  .brand span{color:var(--text);font-weight:500;letter-spacing:0}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#1c1c1f;
    border:1px solid var(--line);border-radius:24px;padding:7px 14px;width:min(360px,40vw)}
  .search input{all:unset;flex:1;font-size:13px;color:var(--text)}
  .search input::placeholder{color:#6a6a72}

  .hero{position:relative;height:min(58vh,480px);display:flex;align-items:flex-end;
    padding:0 48px 42px;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 100% at 20% 0%,rgba(229,9,20,.22),transparent 60%),
               linear-gradient(0deg,var(--bg) 4%,rgba(10,10,11,.35) 60%,rgba(10,10,11,.85))}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;
    filter:saturate(.9) contrast(1.05);transition:background-image .5s}
  .hero-in{position:relative;z-index:2;max-width:640px}
  .kicker{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--green);margin-bottom:10px}
  .hero h1{font-size:clamp(28px,4.4vw,52px);line-height:1.03;letter-spacing:-1.6px;font-weight:800}
  .metaline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 10px;
    font-size:12.5px;color:var(--dim)}
  .pill{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px}
  .hero p.syn{font-size:13.5px;line-height:1.55;color:#c9c9cf;max-width:52ch}
  .row-btns{display:flex;gap:10px;margin-top:18px}
  .btn{border:0;border-radius:6px;padding:11px 22px;font-size:13.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn.p{background:var(--text);color:#111}
  .btn.s{background:rgba(255,255,255,.13);color:var(--text);backdrop-filter:blur(6px)}

  main{padding:8px 48px 130px}
  .list-head{display:flex;align-items:baseline;gap:14px;margin:18px 0 6px}
  .list-head h2{font-size:17px;font-weight:700;letter-spacing:.2px}
  .list-head span{font-size:11.5px;color:#5a5a62}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 16px}
  .card{position:relative;cursor:pointer;transition:transform .18s ease}
  .card:hover{transform:translateY(-4px);z-index:5}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:7px;overflow:hidden;
    background:linear-gradient(135deg,#1a1a22,#2a1a2a);box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s}
  .card:hover .thumb img{filter:brightness(1.12)}
  .dead .thumb img{filter:grayscale(1) brightness(.5)}
  .flag{position:absolute;top:7px;left:7px;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;
    background:rgba(0,0,0,.82);border-radius:4px;padding:3px 6px;color:#e8e8ea}
  .flag.bad{background:rgba(229,9,20,.9)}
  .tick{position:absolute;top:7px;right:7px;font-size:10px;background:rgba(0,0,0,.78);
    border-radius:4px;padding:3px 6px;color:#d8d8dc}
  .card .cap{padding:8px 2px 0}
  .card .t{font-size:12.5px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .s{font-size:10.5px;color:var(--dim);margin-top:3px}
  .vote{display:flex;align-items:center;gap:4px;margin-top:6px;opacity:.7;transition:opacity .15s}
  .card:hover .vote{opacity:1}
  .vote button{all:unset;cursor:pointer;font-size:10px;padding:3px 7px;border-radius:4px;
    background:rgba(255,255,255,.1);color:#c9c9cf;transition:.15s;letter-spacing:.3px;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .vote button:hover{background:rgba(255,255,255,.18)}
  .vote .v-ok:hover{color:#39d353}
  .vote .v-fake:hover{color:#e50914}
  .vote .v-count{font-size:9.5px;color:#6a6a72;margin-left:2px}

  .more{display:block;margin:34px auto 10px;background:#1f1f23;border:1px solid var(--line);
    color:#e6e6ea;border-radius:8px;padding:12px 30px;font-size:13px;font-weight:600;cursor:pointer}
  .more:hover{background:#2a2a30}
  .empty{padding:70px 0;color:var(--dim);font-size:14px;text-align:center}

  .foot{padding:30px 48px;color:#5c5c64;font-size:11.5px;border-top:1px solid var(--line);
    display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);margin-right:6px}

  #veil{position:fixed;inset:0;z-index:200;background:#000;display:none;
    flex-direction:column;align-items:center;justify-content:center}
  #veil.on{display:flex}
  #veil .bar{display:flex;align-items:center;gap:14px;width:min(1200px,94vw);padding:10px 4px 14px}
  #veil .bar h3{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #veil .bar button{all:unset;cursor:pointer;color:var(--dim);font-size:22px;line-height:1;padding:4px 8px}
  #veil .bar button:hover{color:var(--text)}
  .frame{width:min(1200px,94vw);aspect-ratio:16/9;background:#111;border-radius:8px;overflow:hidden}
  .frame iframe{width:100%;height:100%;border:0;display:block}

  #alice{position:fixed;left:16px;bottom:16px;z-index:90;width:238px;background:rgba(20,20,22,.92);
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;backdrop-filter:blur(10px);
    font-size:11.5px;line-height:1.5;color:#b9b9c0;box-shadow:0 8px 26px rgba(0,0,0,.5)}
  #alice .ahead{display:flex;align-items:center;gap:7px;color:#e8e8ea;font-size:11px;
    letter-spacing:1.3px;text-transform:uppercase;margin-bottom:6px}
  #alice .dot{width:6px;height:6px;border-radius:50%;background:var(--green);
    box-shadow:0 0 7px var(--green);flex:0 0 auto}
  #alice.busy .dot{background:#e5a50a;box-shadow:0 0 7px #e5a50a}
  #alice .abody b{color:#e8e8ea;font-weight:600}
  #alice button{margin-top:8px;width:100%;background:#1f1f23;border:1px solid var(--line);
    color:#d4d4da;border-radius:6px;padding:6px 8px;font-size:11px;cursor:pointer;transition:.15s}
  #alice button:hover{background:#2a2a30;color:#fff}
  @media(max-width:760px){
    #alice{display:none}
    .vote{opacity:1}
    .vote button{font-size:12px;padding:6px 10px;min-height:32px;touch-action:manipulation}
    header{padding:12px 16px;gap:12px}
    .hero{padding:0 18px 30px;height:auto;margin-top:52px}
    main{padding:8px 18px 130px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px}
    .card .t{font-size:11.5px}
  }
</style>
</head>
<body>

<header id="hdr">
  <div class="brand">GEORGEANTON <span>FLICKS</span></div>
  <label class="search">
    <input id="q" type="search" placeholder="Search 1,300+ movies…" autocomplete="off">
  </label>
</header>

<section class="hero" id="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-in">
    <div class="kicker">Curated by Alice · full films, free</div>
    <h1 id="hero-title">Loading library…</h1>
    <div class="metaline" id="hero-meta"></div>
    <p class="syn" id="hero-syn"></p>
    <div class="row-btns">
      <button class="btn p" id="hero-play">▶ Play</button>
      <button class="btn s" id="hero-rand">🎲 Surprise me</button>
    </div>
  </div>
</section>

<main id="main">
  <div class="list-head"><h2>Every movie</h2><span id="list-count"></span></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more">Show more</button>
</main>

<div class="foot">
  <span><span class="led"></span><span id="stat">connecting…</span></span>
  <span>Every playback is served by YouTube. Alice only curates the shelf.</span>
  <span id="built"></span>
</div>

<aside id="alice">
  <div class="ahead"><span class="dot"></span> Alice · librarian</div>
  <div class="abody" id="alice-body">Reading the shelf…</div>
  <button id="alice-run">Ask her to crawl now</button>
</aside>

<div id="veil">
  <div class="bar">
    <button id="veil-back" class="btn s" style="padding:8px 14px;font-size:13px">← Back to shelf</button>
    <h3 id="veil-title"></h3>
    <div class="vote" id="veil-vote" style="opacity:1;gap:6px">
      <button class="v-ok" title="Real movie">✓ OK</button>
      <button class="v-fake" title="Fake / slideshow">✗ FAKE</button>
      <span class="v-count"></span>
    </div>
    <button id="veil-x" title="Close (Esc)">✕</button>
  </div>
  <div class="frame" id="frame"></div>
</div>

<script>
const API = '/api/catalog';
let CAT = [], Q = '', SHOWN = 60, VOTES = {}, FEATURED = [], FI = 0;
const PAGE = 60;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins = s => s ? Math.round(s / 60) + 'm' : '';

// YouTube thumbnails: mqdefault is the reliable 16:9 one; try the big ones first.
const YTImg = (id, name) => `https://i.ytimg.com/vi/${id}/${name}.jpg`;
// Best first. YouTube often serves maxresdefault as a 120x90 GREY placeholder
// with HTTP 200 (not a 404!), so onerror never fires — we must check width too.
const THUMBS = ['maxresdefault', 'sddefault', 'hqdefault', 'mqdefault'];
function nextThumb(img, id){
  const i = Number(img.dataset.step || 0) + 1;
  if (i >= THUMBS.length){
    img.onerror = img.onload = null; img.style.display = 'none';
    const t = img.parentElement;
    if (t && !t.querySelector('.placeholder')){
      const p = document.createElement('div');
      p.className = 'placeholder';
      p.textContent = img.alt || '';
      p.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:12px;color:#8b8b93;font-weight:600';
      t.appendChild(p);
    }
    return;
  }
  img.dataset.step = i;
  img.onerror = () => nextThumb(img, id);
  img.onload = () => { if (img.naturalWidth < 300) nextThumb(img, id); };
  img.src = YTImg(id, THUMBS[i]);
}
// called from the inline onerror on the first (maxresdefault) image
function posterStep(img, id){ nextThumb(img, id); }
// also check already-loaded images for the tiny grey placeholder
function sweepThumbs(){
  document.querySelectorAll('#grid .thumb img').forEach(img => {
    if (img.complete && img.naturalWidth > 0 && img.naturalWidth < 300 && !img.dataset.swept){
      img.dataset.swept = '1';
      img.dataset.step = '0';
      nextThumb(img, img.getAttribute('alt') ? (img.closest('.card')?.dataset.id) : '');
    }
  });
}

function playable(m){ return m.status === 'ok' || m.status === 'restricted'; }
function visible(m){ return m.status !== 'fake' && m.status !== 'removed'; }

function pickFeatured(){
  const ok = CAT.filter(m => playable(m) && m.status !== 'fake');
  ok.sort((a,b) => (b.year||0)-(a.year||0) || (b.added_at||0)-(a.added_at||0));
  return ok.slice(0, 12);
}

function showFeature(){
  if (!FEATURED.length) return;
  const m = FEATURED[FI % FEATURED.length];
  $('#hero-title').textContent = m.title;
  const bg = YTImg(m.id, 'maxresdefault');
  $('#hero-bg').style.backgroundImage = `url(${bg}),url(${YTImg(m.id,'mqdefault')})`;
  $('#hero-meta').innerHTML = [
    m.year ? `<span class="pill">${m.year}</span>` : '',
    m.duration ? `<span>${mins(m.duration)}</span>` : '',
    (m.genres||[]).slice(0,3).map(g => `<span class="pill">${esc(g)}</span>`).join(''),
    `<span>${esc(m.source||'')}</span>`,
  ].join('');
  $('#hero-syn').textContent = `From ${m.source||'YouTube'}. One of ${CAT.length} films Alice found for you.`;
  $('#hero-play').onclick = () => openFilm(m);
}

function card(m){
  const dead = !playable(m);
  return `<article class="card ${dead?'dead':''}" data-id="${m.id}">
    <div class="thumb">
      <img src="${YTImg(m.id,'maxresdefault')}" alt="${esc(m.title)}" onerror="posterStep(this,'${m.id}')">
      ${m.status === 'ok' ? '' : `<span class="flag bad">${esc(m.status)}</span>`}
      ${m.duration ? `<span class="tick">${mins(m.duration)}</span>` : ''}
    </div>
    <div class="cap">
      <div class="t">${esc(m.title)}</div>
      <div class="s">${m.year ? m.year+' · ':''}${esc(m.source||'')}${
        (m.regions&&m.regions.length) ? ' · 🌍 '+m.regions.slice(0,4).join(' ') : ''}</div>
      <div class="vote" data-id="${m.id}">
        <button class="v-ok" title="Real movie">✓ OK</button>
        <button class="v-fake" title="Fake / slideshow">✗ FAKE</button>
        <span class="v-count"></span>
      </div>
    </div>
  </article>`;
}

function filtered(){
  let rows = CAT.filter(visible);
  if (Q) rows = rows.filter(m => (m.title+' '+(m.source||'')+' '+(m.genres||[]).join(' '))
    .toLowerCase().includes(Q));
  // newest and most-recently-added first, then alphabetical
  rows.sort((a,b) => (b.year||0)-(a.year||0) || (b.added_at||0)-(a.added_at||0)
    || a.title.localeCompare(b.title));
  return rows;
}

function render(){
  const rows = filtered();
  $('#list-count').textContent = `${rows.length} films · Alice checks them every night`;
  const slice = rows.slice(0, SHOWN);
  $('#grid').innerHTML = slice.map(card).join('');
  $('#more').style.display = rows.length > SHOWN ? 'block' : 'none';
  $('#more').textContent = `Show more (${rows.length - SHOWN} left)`;
  document.querySelectorAll('.card').forEach(c => {
    c.onclick = () => openFilm(CAT.find(m => m.id === c.dataset.id));
  });
  paintVotes();
  setTimeout(sweepThumbs, 1200);
}

function paintVotes(){
  document.querySelectorAll('.vote').forEach(w => {
    const id = w.dataset.id;
    const v = (VOTES.votes||{})[id] || {ok:0,fake:0};
    const c = w.querySelector('.v-count');
    if (c) c.textContent = (v.ok||0)+(v.fake||0) ? `✓${v.ok||0} ✗${v.fake||0}` : '';
  });
}

$('#more').onclick = () => { SHOWN += PAGE; render(); };

$('#q').oninput = e => { Q = e.target.value.trim().toLowerCase(); SHOWN = PAGE; render(); };

function openFilm(m){
  if (!m) return;
  $('#veil-title').textContent = m.title + (m.year ? ` (${m.year})` : '');
  $('#frame').innerHTML = `<iframe src="https://www.youtube.com/embed/${m.id}?autoplay=1&rel=0&modestbranding=1"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  const vw = $('#veil-vote'); vw.dataset.id = m.id;
  const v = (VOTES.votes||{})[m.id] || {ok:0,fake:0};
  const c = vw.querySelector('.v-count');
  if (c) c.textContent = (v.ok||0)+(v.fake||0) ? `✓${v.ok||0} ✗${v.fake||0}` : '';
  $('#veil').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeVeil(){
  $('#veil').classList.remove('on');
  $('#frame').innerHTML = '';
  document.body.style.overflow = '';
}
$('#veil-x').onclick = closeVeil;
$('#veil-back').onclick = closeVeil;
$('#veil').addEventListener('click', e => { if (e.target === $('#veil')) closeVeil(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVeil(); });

$('#hero-rand').onclick = () => {
  const ok = CAT.filter(playable);
  if (ok.length) openFilm(ok[Math.floor(Math.random()*ok.length)]);
};

document.addEventListener('click', async e => {
  const b = e.target.closest('.vote button');
  if (!b) return;
  e.stopPropagation();
  const w = b.closest('.vote'), id = w.dataset.id;
  const vote = b.classList.contains('v-ok') ? 'ok' : 'fake';
  try {
    const r = await fetch('/api/vote', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, vote})});
    const d = await r.json();
    if (d.ok){
      if (!VOTES.votes) VOTES.votes = {};
      VOTES.votes[id] = d.votes;
      const c = w.querySelector('.v-count');
      if (c) c.textContent = `✓${d.votes.ok||0} ✗${d.votes.fake||0}`;
      w.querySelectorAll('button').forEach(x => { x.disabled = true; x.style.opacity='.4'; x.style.cursor='default'; });
      if (vote === 'fake' && (d.votes.fake||0) >= (d.votes.ok||0)+1){
        const card = w.closest('.card'); if (card) card.classList.add('dead');
      }
    } else if (d.reason === 'already voted'){
      w.querySelectorAll('button').forEach(x => { x.disabled = true; x.style.opacity='.4'; x.style.cursor='default'; });
    }
  } catch {}
});

window.addEventListener('scroll', () => {
  $('#hdr').classList.toggle('solid', window.scrollY > 12);
}, {passive:true});

async function aliceStatus(){
  const box = $('#alice'), body = $('#alice-body');
  try {
    const d = await fetch('/api/health', {cache:'no-store'}).then(r => r.json());
    const rf = d.refresh||{};
    if (rf.running){
      box.classList.add('busy');
      body.innerHTML = 'Crawling the uploaders now…';
      setTimeout(aliceStatus, 6000); return;
    }
    box.classList.remove('busy');
    body.innerHTML = `<b>${d.playable}</b> of <b>${d.count}</b> films playable.`;
  } catch { body.textContent = 'Server is not answering.'; }
}
$('#alice-run').onclick = async () => {
  $('#alice').classList.add('busy');
  $('#alice-body').textContent = 'Waking up…';
  try { await fetch('/api/refresh', {method:'POST'}); } catch {}
  setTimeout(aliceStatus, 2500);
};

async function boot(){
  try {
    const r = await fetch(API, {cache:'no-store'});
    const d = await r.json();
    CAT = d.movies || [];
    $('#stat').textContent = `${CAT.length} films · ${d.sources||'?'} uploaders`;
    $('#built').textContent = d.built ? 'updated '+new Date(d.built*1000).toLocaleDateString() : '';
  } catch { CAT=[]; $('#stat').textContent='catalog unavailable'; }
  try { VOTES = await fetch('/api/votes').then(r=>r.json()); } catch { VOTES={votes:{}}; }
  FEATURED = pickFeatured(); FI = 0;
  if (FEATURED.length) showFeature();
  setInterval(() => { FI++; showFeature(); }, 12000);
  $('#hero-rand').onclick = () => {
    const ok = CAT.filter(playable);
    if (ok.length) openFilm(ok[Math.floor(Math.random()*ok.length)]);
  };
  render();
  aliceStatus();
}
boot();
</script>
</body>
</html>
